<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUKI & YUKIKO WEDDING QUIZ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f7f3ec;
      color: #4a443c;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px 24px 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .screen {
      width: 100%;
      display: none;
    }

    .screen.active {
      display: block;
    }

    .small-title {
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 3px;
      color: #9b8062;
      margin-bottom: 10px;
    }

    .title {
      font-family: Georgia, serif;
      font-size: 27px;
      letter-spacing: 2px;
      color: #735f49;
      margin-bottom: 36px;
    }

    .line {
      width: 45px;
      height: 1px;
      background: #bca98f;
      margin: 0 auto 35px;
    }

    .guest-name {
      font-family: "Yu Mincho", Georgia, serif;
      font-size: 26px;
      letter-spacing: 2px;
      margin-bottom: 28px;
    }

    .welcome {
      font-size: 15px;
      line-height: 2;
      margin-bottom: 22px;
    }

    .sub-text {
      font-size: 14px;
      line-height: 2;
      color: #777066;
      margin-bottom: 38px;
    }

    button {
      font-family: inherit;
    }

    .main-button {
      width: 220px;
      padding: 17px;
      border: none;
      border-radius: 50px;
      background: #b78d75;
      color: #fff;
      font-family: Georgia, serif;
      font-size: 14px;
      letter-spacing: 3px;
      cursor: pointer;
    }

    .question-number {
      font-family: Georgia, serif;
      letter-spacing: 2px;
      font-size: 13px;
      color: #9b8062;
      margin-bottom: 10px;
    }

    .progress {
      height: 4px;
      width: 100%;
      background: #e3ddd4;
      border-radius: 10px;
      margin-bottom: 35px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 20%;
      background: #b78d75;
      transition: width 0.4s ease;
    }

    .question {
      font-size: 20px;
      line-height: 1.7;
      font-weight: 600;
      margin-bottom: 30px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .choice-button {
      width: 100%;
      padding: 16px 18px;
      border: 1px solid #d8cec1;
      background: rgba(255,255,255,0.55);
      border-radius: 14px;
      font-size: 15px;
      color: #4a443c;
      cursor: pointer;
      text-align: left;
      line-height: 1.5;
    }

    .choice-button:active {
      transform: scale(0.98);
    }

    .score {
      font-family: Georgia, serif;
      font-size: 46px;
      color: #735f49;
      margin: 20px 0 25px;
    }

    .fade-text {
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 2.5s ease, transform 2.5s ease;
    }

    .fade-text.show {
      opacity: 1;
      transform: translateY(0);
    }

    .final-intro {
      font-family: "Yu Mincho", serif;
      font-size: 22px;
      line-height: 2;
      letter-spacing: 2px;
    }

    .message-name {
      font-family: "Yu Mincho", serif;
      font-size: 26px;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .personal-message {
      font-family: "Yu Mincho", serif;
      font-size: 16px;
      line-height: 2.3;
      white-space: pre-wrap;
      text-align: left;
      padding: 0 8px;
    }

    .signature {
      font-family: Georgia, serif;
      margin-top: 35px;
      letter-spacing: 2px;
      font-size: 13px;
      color: #8c8174;
    }

    .loading,
    .error {
      font-size: 14px;
      line-height: 2;
      color: #777;
    }

    .footer {
      position: absolute;
      bottom: 24px;
      font-family: Georgia, serif;
      font-size: 10px;
      letter-spacing: 2px;
      color: #aaa096;
      left: 0;
      right: 0;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- 読み込み -->
  <div id="loadingScreen" class="screen active">
    <div class="loading">Loading...</div>
  </div>

  <!-- エラー -->
  <div id="errorScreen" class="screen">
    <div id="errorText" class="error"></div>
  </div>

  <!-- Welcome -->
  <div id="welcomeScreen" class="screen">

    <div class="small-title">YUKI & YUKIKO</div>
    <div class="title">WEDDING QUIZ</div>
    <div class="line"></div>

    <div id="welcomeName" class="guest-name"></div>

    <div class="welcome">
      今日は来てくれて<br>
      ありがとうございます
    </div>

    <div class="sub-text">
      ふたりにまつわる<br>
      クイズに挑戦！
    </div>

    <button class="main-button" onclick="startQuiz()">
      START
    </button>

  </div>

  <!-- Quiz -->
  <div id="quizScreen" class="screen">

    <div id="questionNumber" class="question-number"></div>

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <div id="questionText" class="question"></div>

    <div id="choices" class="choices"></div>

  </div>

  <!-- Score -->
  <div id="scoreScreen" class="screen">

    <div class="small-title">THANK YOU</div>

    <div class="welcome">
      回答ありがとうございました！
    </div>

    <div class="sub-text" style="margin-bottom:10px;">
      あなたの結果は…
    </div>

    <div id="scoreText" class="score"></div>

    <div class="sub-text">
      クイズの結果は<br>
      披露宴でもお楽しみに！
    </div>

  </div>

  <!-- 最後に… -->
  <div id="introScreen" class="screen">

    <div id="finalIntro" class="final-intro fade-text">
      最後に、<br>
      ふたりからあなたへ。
    </div>

  </div>

  <!-- Message -->
  <div id="messageScreen" class="screen">

    <div id="messageContent" class="fade-text">

      <div id="messageName" class="message-name"></div>

      <div id="personalMessage" class="personal-message"></div>

      <div class="signature">
        YUKI & YUKIKO
      </div>

    </div>

  </div>

  <div class="footer">2026.08.09</div>

</div>

<script>

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbxrA-Wr9HPMuesssOCNxYN-PkvYZ-7g41MmFXZbKQvAJ69PU2VmlYfLq05WDmpDZoR5sA/exec";

  const params = new URLSearchParams(window.location.search);
  const guestId = params.get("id");

  let guestData = null;
  let currentQuestion = 0;
  let score = 0;

  // 仮クイズ
  const questions = [
    {
      question: "新郎の出身地はどこ？",
      choices: [
        "福井県",
        "滋賀県",
        "兵庫県",
        "京都府"
      ],
      correct: 2
    },
    {
      question: "新郎新婦がプロポーズの日に訪れた場所は？",
      choices: [
        "USJ",
        "東京ディズニーシー",
        "沖縄",
        "北海道"
      ],
      correct: 1
    },
    {
      question: "新郎の趣味ではないものはどれ？",
      choices: [
        "キャンプ",
        "スノーボード",
        "DIY",
        "サーフィン"
      ],
      correct: 3
    },
    {
      question: "新婦が高校時代にしていたスポーツは？",
      choices: [
        "バレーボール",
        "ソフトボール",
        "バドミントン",
        "テニス"
      ],
      correct: 1
    },
    {
      question: "今日、ふたりが一番願っていることは？",
      choices: [
        "雨が降らないこと",
        "料理が余らないこと",
        "みんなに楽しんでもらうこと",
        "新郎が噛まずに挨拶すること"
      ],
      correct: 2
    }
  ];

  async function loadGuest() {

    if (!guestId) {
      showError(
        "ゲスト情報を確認できませんでした。<br><br>" +
        "エスコートカードのQRコードから<br>" +
        "もう一度アクセスしてください。"
      );
      return;
    }

    try {

      const response = await fetch(
        GAS_URL + "?id=" + encodeURIComponent(guestId)
      );

      const data = await response.json();

      if (!data.success) {
        showError("ゲスト情報を確認できませんでした。");
        return;
      }

      guestData = data;

      document.getElementById("welcomeName").textContent =
        data.name + " さん";

      showScreen("welcomeScreen");

    } catch (error) {

      console.error(error);

      showError(
        "読み込み中にエラーが発生しました。<br><br>" +
        "通信環境をご確認のうえ、<br>" +
        "もう一度お試しください。"
      );
    }
  }

  function showScreen(id) {

    document.querySelectorAll(".screen").forEach(screen => {
      screen.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
  }

  function showError(message) {

    document.getElementById("errorText").innerHTML = message;

    showScreen("errorScreen");
  }

  function startQuiz() {

    currentQuestion = 0;
    score = 0;

    showScreen("quizScreen");

    showQuestion();
  }

  function showQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
      `QUESTION ${String(currentQuestion + 1).padStart(2, "0")} / ${String(questions.length).padStart(2, "0")}`;

    document.getElementById("progressBar").style.width =
      `${((currentQuestion + 1) / questions.length) * 100}%`;

    document.getElementById("questionText").textContent =
      q.question;

    const choices = document.getElementById("choices");

    choices.innerHTML = "";

    q.choices.forEach((choice, index) => {

      const button = document.createElement("button");

      button.className = "choice-button";

      const labels = ["A", "B", "C", "D"];

      button.textContent =
        `${labels[index]}. ${choice}`;

      button.onclick = () => answerQuestion(index);

      choices.appendChild(button);
    });
  }

  function answerQuestion(selectedIndex) {

    const q = questions[currentQuestion];

    if (selectedIndex === q.correct) {
      score++;
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {

      showQuestion();

    } else {

      showResult();
    }
  }

  function showResult() {

    showScreen("scoreScreen");

    document.getElementById("scoreText").textContent =
      `${score} / ${questions.length}`;

    setTimeout(() => {

      showScreen("introScreen");

      setTimeout(() => {
        document.getElementById("finalIntro")
          .classList.add("show");
      }, 200);

    }, 3000);

    setTimeout(() => {

      document.getElementById("finalIntro")
        .classList.remove("show");

      showScreen("messageScreen");

      document.getElementById("messageName").textContent =
        guestData.name + " へ";

      document.getElementById("personalMessage").textContent =
        guestData.message;

      setTimeout(() => {

        document.getElementById("messageContent")
          .classList.add("show");

      }, 300);

    }, 7000);
  }

  loadGuest();

</script>

</body>
</html>
