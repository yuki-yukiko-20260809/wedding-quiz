<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>YUKI & YUKIKO WEDDING QUIZ</title>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


/* =========================
   画面全体
========================= */

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}


body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background: #f7f3ec;

  color: #4a443c;

  overflow: hidden;
}


/* =========================
   全体
========================= */

.container {

  width: 100%;
  max-width: 430px;

  height: 100vh;
  height: 100dvh;

  margin: 0 auto;

  padding:
    max(20px, env(safe-area-inset-top))
    24px
    max(20px, env(safe-area-inset-bottom));

  display: flex;

  align-items: center;
  justify-content: center;

  position: relative;

  text-align: center;

  overflow: hidden;
}


.screen {

  width: 100%;

  max-height: 100%;

  display: none;
}


.screen.active {

  display: block;
}


/* =========================
   個別メッセージ画面のみ
   長文の場合はスクロール可能
========================= */

#messageScreen.active {

  max-height: 100%;

  overflow-y: auto;
  overflow-x: hidden;

  padding:
    12px
    0
    24px;

  -webkit-overflow-scrolling: touch;

  scrollbar-width: none;
}


#messageScreen.active::-webkit-scrollbar {

  display: none;
}


/* =========================
   タイトル
========================= */

.small-title {

  font-family:
    Georgia,
    serif;

  font-size: 13px;

  letter-spacing: 3px;

  color: #9b8062;

  margin-bottom: 10px;
}


.title {

  font-family:
    Georgia,
    serif;

  font-size: 27px;

  letter-spacing: 2px;

  color: #735f49;

  margin-bottom: 35px;
}


.line {

  width: 45px;

  height: 1px;

  background: #bca98f;

  margin:
    0 auto
    35px;
}


/* =========================
   名前
========================= */

.guest-name {

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size: 25px;

  font-weight: normal;

  letter-spacing: 2px;

  margin-bottom: 28px;
}


/* =========================
   Welcome
========================= */

.welcome {

  font-size: 15px;

  line-height: 2;

  letter-spacing: 1px;

  margin-bottom: 22px;
}


.sub-text {

  font-size: 14px;

  line-height: 2;

  letter-spacing: 1px;

  color: #777066;

  margin-bottom: 40px;
}


/* =========================
   メインボタン
========================= */

.main-button {

  width: 220px;

  padding: 17px;

  border: none;

  border-radius: 50px;

  background: #b78d75;

  color: white;

  font-family:
    Georgia,
    serif;

  font-size: 14px;

  letter-spacing: 3px;

  cursor: pointer;

  touch-action: manipulation;
}


.main-button:active {

  transform: scale(0.97);
}


/* =========================
   クイズ
========================= */

.question-number {

  font-family:
    Georgia,
    serif;

  font-size: 13px;

  letter-spacing: 2px;

  color: #9b8062;

  margin-bottom: 12px;
}


.progress {

  width: 100%;

  height: 4px;

  background: #e3ddd4;

  border-radius: 10px;

  overflow: hidden;

  margin-bottom: 34px;
}


.progress-bar {

  height: 100%;

  background: #b78d75;

  transition:
    width
    0.4s
    ease;
}


.question {

  font-size: 19px;

  font-weight: 600;

  line-height: 1.8;

  margin-bottom: 28px;

  padding:
    0
    4px;
}


.choices {

  display: flex;

  flex-direction: column;

  gap: 11px;
}


.choice-button {

  width: 100%;

  padding:
    15px
    17px;

  border:
    1px solid
    #d8cec1;

  border-radius: 14px;

  background:
    rgba(
      255,
      255,
      255,
      0.6
    );

  color: #4a443c;

  font-size: 14px;

  line-height: 1.5;

  text-align: left;

  cursor: pointer;

  touch-action: manipulation;
}


.choice-button:active {

  transform: scale(0.98);

  background: #eee4dc;
}


/* =========================
   送信中
========================= */

.sending {

  font-size: 14px;

  line-height: 2;

  color: #777066;
}


/* =========================
   スコア
========================= */

.score {

  font-family:
    Georgia,
    serif;

  font-size: 48px;

  color: #735f49;

  margin:
    20px
    0
    25px;
}


/* =========================
   メッセージ演出
========================= */

.fade-text {

  opacity: 0;

  transform:
    translateY(18px);

  transition:
    opacity 2.8s ease,
    transform 2.8s ease;
}


.fade-text.show {

  opacity: 1;

  transform:
    translateY(0);
}


.final-intro {

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size: 22px;

  line-height: 2.2;

  letter-spacing: 2px;
}


.message-name {

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size: 27px;

  letter-spacing: 2px;

  margin-bottom: 32px;
}


.personal-message {

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size: 16px;

  line-height: 2.3;

  letter-spacing: 0.5px;

  white-space: pre-wrap;

  text-align: left;

  padding:
    0
    8px;
}


.signature {

  font-family:
    Georgia,
    serif;

  margin-top: 38px;

  padding-bottom: 20px;

  letter-spacing: 2px;

  font-size: 13px;

  color: #8c8174;
}


/* =========================
   Loading / Error
========================= */

.loading,
.error {

  font-size: 14px;

  line-height: 2;

  color: #777066;
}


.loading-message {

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  font-size: 17px;

  line-height: 2.1;

  letter-spacing: 1px;

  color: #4a443c;

  margin-top: 24px;
}


.error {

  color: #8b6464;
}


/* =========================
   高さが低いスマホ
   iPhone SEなど
========================= */

@media screen and (max-height: 700px) {

  .container {

    padding:
      max(12px, env(safe-area-inset-top))
      20px
      max(12px, env(safe-area-inset-bottom));
  }


  .title {

    font-size: 24px;

    margin-bottom: 24px;
  }


  .line {

    margin-bottom: 24px;
  }


  .guest-name {

    font-size: 22px;

    margin-bottom: 18px;
  }


  .welcome {

    font-size: 14px;

    line-height: 1.8;

    margin-bottom: 16px;
  }


  .sub-text {

    font-size: 13px;

    line-height: 1.8;

    margin-bottom: 24px;
  }


  .main-button {

    width: 200px;

    padding: 14px;
  }


  .question-number {

    margin-bottom: 8px;
  }


  .progress {

    margin-bottom: 22px;
  }


  .question {

    font-size: 17px;

    line-height: 1.6;

    margin-bottom: 20px;
  }


  .choices {

    gap: 8px;
  }


  .choice-button {

    padding:
      11px
      14px;

    font-size: 13px;
  }


  .message-name {

    font-size: 23px;

    margin-bottom: 22px;
  }


  .personal-message {

    font-size: 14px;

    line-height: 2;
  }


  .signature {

    margin-top: 26px;
  }
}


/* =========================
   横幅が小さいスマホ
========================= */

@media screen and (max-width: 360px) {

  .container {

    padding-left: 18px;
    padding-right: 18px;
  }


  .title {

    font-size: 23px;

    letter-spacing: 1.5px;
  }


  .guest-name {

    font-size: 21px;
  }


  .question {

    font-size: 17px;
  }


  .choice-button {

    font-size: 13px;
  }
}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     LOADING
========================= -->

<div
  id="loadingScreen"
  class="screen active"
>

  <div class="small-title">

    Loading...<br><br>

    現在 新郎新婦<br>
    
    人生最高の日を迎える準備中です!<br><br>

    その間にクイズに挑戦して<br>

    挙式までお待ちください!!

  </div>

</div>


<!-- =========================
     ERROR
========================= -->

<div
  id="errorScreen"
  class="screen"
>

  <div
    id="errorText"
    class="error"
  ></div>

</div>


<!-- =========================
     WELCOME
========================= -->

<div
  id="welcomeScreen"
  class="screen"
>

  <div class="small-title">

    YUKI & YUKIKO

  </div>

  <div class="title">

    WEDDING QUIZ

  </div>

  <div class="line"></div>


  <div
    id="welcomeName"
    class="guest-name"
  ></div>


  <div class="welcome">

    本日は私たちの結婚式に<br>

    お越しいただき<br>

    誠にありがとうございます

  </div>


  <div class="sub-text">

    まずは最初のイベントとして<br>
    クイズに挑戦してみてください!!<br><br> 
    始まるまでに、忘れずに回答してくださいね！
    <br>

  </div>


  <button
    class="main-button"
    onclick="startQuiz()"
  >

    START

  </button>

</div>


<!-- =========================
     QUIZ
========================= -->

<div
  id="quizScreen"
  class="screen"
>

  <div
    id="questionNumber"
    class="question-number"
  ></div>


  <div class="progress">

    <div
      id="progressBar"
      class="progress-bar"
    ></div>

  </div>


  <div
    id="questionText"
    class="question"
  ></div>


  <div
    id="choices"
    class="choices"
  ></div>

</div>


<!-- =========================
     SENDING
========================= -->

<div
  id="sendingScreen"
  class="screen"
>

  <div class="small-title">

    THANK YOU

  </div>

  <div class="sending">

    回答を送信しています…

  </div>

</div>


<!-- =========================
     SCORE
========================= -->

<div
  id="scoreScreen"
  class="screen"
>

  <div class="small-title">

    THANK YOU

  </div>


  <div class="welcome">

    回答ありがとうございました！

  </div>


  <div
    class="sub-text"
    style="margin-bottom:10px;"
  >

    あなたの結果は…

  </div>


  <div
    id="scoreText"
    class="score"
  ></div>


  <div class="sub-text">

    クイズの結果は<br>

    披露宴でもお楽しみに！

  </div>

</div>


<!-- =========================
     MESSAGE INTRO
========================= -->

<div
  id="introScreen"
  class="screen"
>

  <div
    id="finalIntro"
    class="final-intro fade-text"
  >

    最後に、<br>

    ふたりからあなたへ。

  </div>

</div>


<!-- =========================
     PERSONAL MESSAGE
========================= -->

<div
  id="messageScreen"
  class="screen"
>

  <div
    id="messageContent"
    class="fade-text"
  >


    <div
      id="messageName"
      class="message-name"
    ></div>


    <div
      id="personalMessage"
      class="personal-message"
    ></div>


    <div class="signature">

      YUKI & YUKIKO

    </div>


  </div>

</div>

  
</div>


<script>


// =====================================
// GAS URL
// =====================================

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbxrA-Wr9HPMuesssOCNxYN-PkvYZ-7g41MmFXZbKQvAJ69PU2VmlYfLq05WDmpDZoR5sA/exec";


// =====================================
// URLパラメータ
// =====================================

const params =
  new URLSearchParams(
    window.location.search
  );

const guestId =
  params.get("id");


// =====================================
// 変数
// =====================================

let guestData = null;

let currentQuestion = 0;

let answers = [];


// =====================================
// クイズ
// =====================================

const questions = [


  // Q1
  {

    question:
      "ウエディングケーキにのっているフルーツはなんでしょうか。",

    choices: [
      "イチゴ",
      "メロン",
      "モモ",
      "シャインマスカット",
      "マンゴー"
    ]

  },


  // Q2
  {

    question:
      "お色直し後の新郎の蝶ネクタイの色は？",

    choices: [
      "赤",
      "青",
      "緑",
      "黄",
      "オレンジ"
    ]

  },


  // Q3
  {

    question:
      "お色直し後の新婦のドレスの色は？",

    choices: [
      "赤",
      "黄",
      "黒",
      "紫",
      "ピンク"
    ]

  },


  // Q4
  {

    question:
      "オリジナルカクテルの組み合わせは？",

    choices: [
      "パイナップルローズ",
      "ピーチローズ",
      "白ぶどうローズ",
      "ライチローズ",
      "アップルローズ"
    ]

  },


  // Q5
  {

    question:
      "乾杯後に流れる曲は？",

    choices: [
      "Cheers（Mrs. GREEN APPLE）",
      "乾杯（長渕剛）",
      "バンザイ（ウルフルズ）",
      "I LOVE...（Official髭男dism）",
      "Marry You（Bruno Mars）"
    ]

  }

];


// =====================================
// 初期読み込み
// =====================================

async function loadGuest() {


  if (!guestId) {

    showError(

      "ゲスト情報を確認できませんでした。<br><br>" +

      "エスコートカードのQRコードから<br>" +

      "もう一度アクセスしてください。"

    );

    return;
  }


  try {


    const response =
      await fetch(

        GAS_URL +
        "?id=" +
        encodeURIComponent(guestId) +
        "&t=" +
        Date.now()

      );


    if (!response.ok) {

      throw new Error(
        "通信エラー"
      );

    }


    const data =
      await response.json();


    if (!data.success) {

      showError(

        "ゲスト情報を確認できませんでした。<br><br>" +

        "エスコートカードをご確認ください。"

      );

      return;
    }


    guestData = data;


    // ---------------------------------
    // 回答済みならメッセージだけ
    // ---------------------------------

    if (data.answered === true) {

      showMessageOnly();

      return;
    }


    // ---------------------------------
    // 初回
    // ---------------------------------

    document
      .getElementById(
        "welcomeName"
      )
      .textContent =
      data.name + " 様";


    showScreen(
      "welcomeScreen"
    );


  } catch (error) {


    console.error(error);


    showError(

      "読み込み中にエラーが発生しました。<br><br>" +

      "通信環境をご確認のうえ、<br>" +

      "もう一度お試しください。"

    );

  }

}


// =====================================
// START
// =====================================

function startQuiz() {


  currentQuestion = 0;

  answers = [];


  showScreen(
    "quizScreen"
  );


  showQuestion();

}


// =====================================
// 問題表示
// =====================================

function showQuestion() {


  const q =
    questions[
      currentQuestion
    ];


  document
    .getElementById(
      "questionNumber"
    )
    .textContent =

    `QUESTION ${
      String(
        currentQuestion + 1
      ).padStart(2, "0")
    } / ${
      String(
        questions.length
      ).padStart(2, "0")
    }`;


  document
    .getElementById(
      "progressBar"
    )
    .style.width =

    `${
      (
        (
          currentQuestion + 1
        ) /
        questions.length
      ) * 100
    }%`;


  document
    .getElementById(
      "questionText"
    )
    .textContent =
    q.question;


  const choices =
    document
      .getElementById(
        "choices"
      );


  choices.innerHTML = "";


  const labels = [
    "A",
    "B",
    "C",
    "D",
    "E"
  ];


  q.choices.forEach(
    (
      choice,
      index
    ) => {


      const button =
        document
          .createElement(
            "button"
          );


      button.className =
        "choice-button";


      button.textContent =
        labels[index] +
        ". " +
        choice;


      button.onclick =
        () =>
          answerQuestion(
            labels[index]
          );


      choices
        .appendChild(
          button
        );

    }
  );

}


// =====================================
// 回答
// =====================================

function answerQuestion(answer) {


  answers.push(answer);


  currentQuestion++;


  if (
    currentQuestion <
    questions.length
  ) {


    showQuestion();


  } else {


    submitAnswers();

  }

}


// =====================================
// GASへ回答送信
// =====================================

async function submitAnswers() {


  showScreen(
    "sendingScreen"
  );


  try {


    const response =
      await fetch(
        GAS_URL,
        {

          method: "POST",

          body:
            JSON.stringify({

              id:
                guestData.id,

              answers:
                answers

            })

        }
      );


    if (!response.ok) {

      throw new Error(
        "回答の送信に失敗しました"
      );

    }


    const result =
      await response.json();


    // ---------------------------------
    // 別端末などですでに回答済み
    // ---------------------------------

    if (
      result.alreadyAnswered
    ) {


      showMessageOnly();

      return;
    }


    if (!result.success) {

      throw new Error(
        result.message ||
        "回答の保存に失敗しました"
      );

    }


    // GAS側で計算した点数
    showResult(
      result.score
    );


  } catch (error) {


    console.error(error);


    showError(

      "回答を送信できませんでした。<br><br>" +

      "通信環境をご確認のうえ、<br>" +

      "もう一度QRコードからアクセスしてください。"

    );

  }

}


// =====================================
// スコア表示
// =====================================

function showResult(score) {


  document
    .getElementById(
      "scoreText"
    )
    .textContent =

    score +
    " / " +
    questions.length;


  showScreen(
    "scoreScreen"
  );


  // 3秒後
  setTimeout(
    () => {


      showScreen(
        "introScreen"
      );


      setTimeout(
        () => {


          document
            .getElementById(
              "finalIntro"
            )
            .classList
            .add(
              "show"
            );


        },
        150
      );


    },
    3000
  );


  // 7.5秒後
  setTimeout(
    () => {


      document
        .getElementById(
          "finalIntro"
        )
        .classList
        .remove(
          "show"
        );


      showPersonalMessage();


    },
    7500
  );

}


// =====================================
// 個別メッセージ
// =====================================

function showPersonalMessage() {


  showScreen(
    "messageScreen"
  );


  const nickname =
    guestData.nickname ||
    guestData.name;


  document
    .getElementById(
      "messageName"
    )
    .textContent =
    nickname + "へ";


  document
    .getElementById(
      "personalMessage"
    )
    .textContent =
    guestData.message;


  const content =
    document
      .getElementById(
        "messageContent"
      );


  content
    .classList
    .remove(
      "show"
    );


  setTimeout(
    () => {


      content
        .classList
        .add(
          "show"
        );


    },
    200
  );

}


// =====================================
// 2回目以降
// メッセージだけ
// =====================================

function showMessageOnly() {


  document
    .getElementById(
      "messageName"
    )
    .textContent =

    (
      guestData.nickname ||
      guestData.name
    ) +
    "へ";


  document
    .getElementById(
      "personalMessage"
    )
    .textContent =
    guestData.message;


  showScreen(
    "messageScreen"
  );


  const content =
    document
      .getElementById(
        "messageContent"
      );


  content
    .classList
    .remove(
      "show"
    );


  setTimeout(
    () => {


      content
        .classList
        .add(
          "show"
        );


    },
    250
  );

}


// =====================================
// 画面切替
// =====================================

function showScreen(id) {


  document
    .querySelectorAll(
      ".screen"
    )
    .forEach(
      screen => {


        screen
          .classList
          .remove(
            "active"
          );


      }
    );


  document
    .getElementById(id)
    .classList
    .add(
      "active"
    );

}


// =====================================
// エラー
// =====================================

function showError(message) {


  document
    .getElementById(
      "errorText"
    )
    .innerHTML =
    message;


  showScreen(
    "errorScreen"
  );

}


// =====================================
// 起動
// =====================================

loadGuest();


</script>


</body>

</html>
